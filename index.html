
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hiragana Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HIRAGANA SELECTION SCREEN -->
    <div id="selectionScreen" class="screen">
        <main class="selection-container">

            <h1>Hiragana Quiz</h1>

            <p class="subtitle">
                Select the hiragana you want to practice.
            </p>

            <div class="selection-controls">
                <button id="selectAll" type="button">Select All</button>
                <button id="clearAll" type="button">Clear All</button>
            </div>

            <p id="selectedCount">0 selected</p>

            <div id="hiraganaChart"></div>

            <div class="start-container">

                <label for="quizMode">Quiz Mode:</label>

                <select id="quizMode">
                    <option value="jp-romaji">Japanese → Romaji</option>
                    <option value="romaji-jp">Romaji → Japanese</option>
                </select>

                <button id="startQuiz" class="start-button" type="button">
                    Start Endless Practice
                </button>

            </div>

        </main>
    </div>


    <!-- QUIZ SCREEN -->
    <div id="quizScreen" class="screen hidden">
        <main class="quiz-container">

            <button id="backButton" class="back-button" type="button">
                ← Back to Selection
            </button>

            <div class="quiz-header">
                <span id="questionNumber">Practice #1</span>

                <div class="answer-stats">
                    <span class="true-stat">T: <span id="trueCount">0</span></span>
                    <span class="false-stat">F: <span id="falseCount">0</span></span>
                </div>
            </div>

            <div class="question-box">
                <p id="question"></p>
            </div>

            <div class="answer-area">
                <input
                    type="text"
                    id="answerInput"
                    placeholder="Type your answer..."
                    autocomplete="off"
                    autocapitalize="off"
                    spellcheck="false"
                    enterkeyhint="done"
                >

                <button id="checkAnswer" type="button">
                    Check Answer
                </button>
            </div>

            <!-- Result message appears here -->
            <div id="feedback" class="feedback" role="status" aria-live="polite"></div>

        </main>
    </div>

    <script src="script.js"></script>

</body>
</html>
