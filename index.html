<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiragana Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- =========================
         HIRAGANA SELECTION SCREEN
         ========================= -->
    <div id="selectionScreen" class="screen">
        <main class="selection-container">

            <h1>Hiragana Quiz</h1>
            <p class="subtitle">
                Select the hiragana you want to practice.
            </p>

            <div class="selection-controls">
                <button id="selectAll">Select All</button>
                <button id="clearAll">Clear All</button>
            </div>

            <p id="selectedCount">0 selected</p>

            <div id="hiraganaChart"></div>

            <div class="start-container">
                <label for="quizMode">Quiz Mode:</label>

                <select id="quizMode">
                    <option value="jp-romaji">
                        Japanese → Romaji
                    </option>

                    <option value="romaji-jp">
                        Romaji → Japanese
                    </option>
                </select>

                <button id="startQuiz" class="start-button">
                    Start Quiz
                </button>
            </div>

        </main>
    </div>


    <!-- =========================
         QUIZ SCREEN
         ========================= -->
    <div id="quizScreen" class="screen hidden">

        <main class="quiz-container">

            <button id="backButton" class="back-button">
                ← Back
            </button>

            <div class="quiz-header">
                <span id="questionNumber">Question 1 / 1</span>
                <span id="score">Score: 0</span>
            </div>

            <div class="question-box">
                <p id="question"></p>
            </div>

            <div class="answer-area">

                <input
                    type="text"
                    id="answerInput"
                    placeholder="Type your answer..."
                    autocomplete="off"
                >

                <button id="checkAnswer">
                    Check Answer
                </button>

            </div>

            <p id="feedback"></p>

            <button id="nextQuestion" class="next-button hidden">
                Next Question →
            </button>

        </main>

    </div>


    <script src="script.js"></script>

</body>
</html>
